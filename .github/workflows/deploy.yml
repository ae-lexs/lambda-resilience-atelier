name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: 'CDK stack to deploy'
        required: true
        default: 'LraBaselineStack'
        type: choice
        options:
          - LraBaselineStack
          - LraObservabilityStack
          - LraSnapStartStack
          - LraProvisionedConcurrencyStack
          - LraDatabaseResilienceStack

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build shaded JAR
    runs-on: ubuntu-latest
    container:
      image: gradle:8-jdk21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build api shaded JAR
        run: ./gradlew :api:shadowJar --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api/build/libs/api.jar
          retention-days: 1

  deploy:
    name: CDK deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1118.2

      - name: Download api JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: api/build/libs/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK deploy
        working-directory: cdk
        env:
          STACK: ${{ github.event.inputs.stack || 'LraBaselineStack' }}
        run: cdk deploy "$STACK" --require-approval never --progress events
