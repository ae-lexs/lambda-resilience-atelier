# Toolchain containers. Nothing runs on the host except Docker and the AWS CLI.
# See README.md — Decisions table, row 4 for rationale.
#
# Invocation patterns:
#   docker compose run --rm build gradle :api:shadowJar         # build the Lambda shaded JAR
#   docker compose run --rm build gradle :cdk:run --args synth  # synthesize CloudFormation
#   docker compose run --rm cdk cdk deploy --all                # deploy to AWS
#   docker compose run --rm cdk cdk destroy --all               # tear down
#
# Optional services (load testing, local Lambda RIE) are gated behind Compose profiles
# and added in later modules — see README.md.

services:

  build:
    image: gradle:8-jdk21
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
    user: gradle

  cdk:
    build:
      context: .
      dockerfile: docker/cdk.Dockerfile
    image: lra-cdk:2.1118.2
    working_dir: /workspace/cdk
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted read-write, not read-only: the AWS SDK rewrites the cached SSO
      # token when it refreshes it. Under :ro the refresh fails and the
      # container loses credentials partway through a long deploy.
      - ${HOME}/.aws:/root/.aws:rw
      - gradle-cache:/root/.gradle
    environment:
      - CDK_DEFAULT_ACCOUNT=${AWS_ACCOUNT_ID}
      - CDK_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-us-east-1}

  k6:
    image: grafana/k6
    profiles: ["loadtest"]
    working_dir: /loadtest
    volumes:
      # Read-write, not read-only: db-breaker-arm.js writes a per-arm JSON
      # summary under loadtest/results/ from handleSummary(). Those files are
      # the experiment's raw record and are committed next to the script that
      # produced them, so a reader can check the write-up against the numbers
      # instead of taking its word for them.
      - ./loadtest:/loadtest:rw
    environment:
      - API_URL=${API_URL}
      # Breaker-experiment parameters. ENDPOINT selects the arm (/db is the
      # unguarded control, /db-breaker the treatment); ARM names the output
      # file. Blank defaults are intentional — the script supplies its own,
      # and Compose would otherwise warn on every unset variable.
      - ENDPOINT=${ENDPOINT:-}
      - RATE=${RATE:-}
      - DURATION=${DURATION:-}
      - ARM=${ARM:-}

volumes:
  gradle-cache:
