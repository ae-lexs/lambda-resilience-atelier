# Force Spring Boot to select a SERVLET web application context at startup.
#
# In the Lambda runtime environment, Spring Boot's classpath probing for
# `jakarta.servlet.Servlet` + `ConfigurableWebApplicationContext` returns inconsistent
# results (the shaded-JAR class-presence check does not always resolve correctly under
# the Lambda CustomerClassLoader). Setting the web application type explicitly bypasses
# the probe and guarantees `aws-serverless-java-container-springboot3` gets the
# `AnnotationConfigServletWebServerApplicationContext` it casts to at
# `SpringBootLambdaContainerHandler.initialize:200`.
spring.main.web-application-type=servlet

# Spring Boot 3.2+ CRaC integration. Triggers a checkpoint during the
# LifecycleProcessor.onRefresh phase — after all non-lazy singletons are
# instantiated and InitializingBean.afterPropertiesSet has run, but before
# Lifecycle.start() is invoked. This is the canonical Spring Boot
# checkpoint phase for SnapStart.
spring.context.checkpoint=onRefresh

# Graceful shutdown timeout — applies during Lifecycle.stop() at checkpoint
# time. Default is 30s. Lambda's beforeCheckpoint window is generous
# (up to 15 min, capped by initialization timeout), but explicit is better
# than implicit.
spring.lifecycle.timeout-per-shutdown-phase=20s

# Connection pool — RDS Proxy endpoint, port, database name come from env vars
# at runtime. The password is replaced at connection time by an IAM token (see
# IamTokenAuthDataSourceConfig.java). The static password value below is a
# placeholder Spring Boot needs to validate properties at startup; the real
# token is injected per-connection via the password supplier.
spring.datasource.url=jdbc:postgresql://${DB_PROXY_ENDPOINT}:5432/${DB_NAME}?ssl=true&sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=placeholder-replaced-at-connect-time
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP sizing. Pool size 5 per Lambda container is a deliberate small
# number — the codelab demonstrates connection exhaustion when k6 drives 100
# concurrent containers (= 500 connection attempts) without the proxy. With
# the proxy, the same 500 client connections are multiplexed to ~80 Aurora
# connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Aggressive timeouts — Lambda invocations are short-lived, so a connection
# the pool has held for >5 minutes has likely been silently closed by the
# database during snapshot. Treat any borrow taking >10 seconds as failed
# rather than blocking the request.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000

# Validation query — issued before each borrow to catch stale snapshot
# connections that the database has reaped.
spring.datasource.hikari.connection-test-query=SELECT 1

# DNS TTL for RDS Proxy hostname resolution. Without this override the JVM
# caches the IP for 30 seconds (default), which can leave restored Lambda
# containers pointing at a stale proxy IP if the proxy was redeployed
# during the snapshot window. See Module 03 Pitfall #5 (cached DNS in
# the snapshot).
spring.datasource.hikari.data-source-properties.networkAddressCacheTtl=0

# HikariCP pool suspension is REQUIRED for HikariCheckpointRestoreLifecycle
# to function. Without this, the WARN line at startup —
#   "HikariDataSource is not configured to allow pool suspension. This will
#    cause problems when the application is checkpointed."
# — is the canary that beforeCheckpoint cannot drain the pool, idle
# connections survive into the snapshot, and the first query after restore
# fails with "connection reset" because the database long ago closed those
# sockets. Treat the WARN as a correctness blocker, not a stylistic note.
spring.datasource.hikari.allow-pool-suspension=true

# Schema + seed initialization. Spring Boot runs schema.sql then data.sql
# from the classpath (api/src/main/resources/) during application
# startup, against the auto-configured DataSource (= our IAM-token-
# authenticated HikariCP wired by IamTokenAuthDataSourceConfig).
#
# RDS Proxy in private isolated subnets is unreachable from outside the
# VPC, so seed data cannot be loaded via psql from the developer laptop.
# Spring's data-source initialization is the production-realistic path —
# the Lambda runs the SQL from inside the VPC during init, with IAM auth
# and TLS already in place.
#
# With SnapStart enabled, init runs once per published version during
# snapshot capture. Restored containers reuse the snapshotted state and
# do not re-execute the scripts. Both schema.sql and data.sql are
# idempotent (IF NOT EXISTS / WHERE NOT EXISTS), so re-deploys with the
# same SQL contents are safe.
#
# continue-on-error=false makes a SQL error fail the application start —
# preferable to running with an inconsistent schema. If you intentionally
# want best-effort init (e.g., pre-existing tables you don't own), flip
# this to true.
#
# The mode is gated by an env var (SPRING_SQL_INIT_MODE) so the same
# shared api/ JAR works on every module's stack. Module 05+ stacks set
# SPRING_SQL_INIT_MODE=always to opt in; Modules 01–04 stacks omit it
# and fall back to "never". Without this gate, Spring's auto-config
# tries to wire dataSourceScriptDatabaseInitializer against a
# (correctly absent) DataSource on earlier stacks, breaking deploys.
# Same rule as the @ConditionalOnProperty gate on IamTokenAuthDataSourceConfig
# and DbController, applied at the property-value layer instead of the
# bean-presence layer.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.continue-on-error=false

# Enable DEBUG-level logging for Spring's JDBC init machinery so the SQL
# script execution events show up in CloudWatch Logs. ScriptUtils logs
# `Executing SQL script from class path resource [schema.sql]` at DEBUG,
# not INFO — without this the auto-configured DataSourceScriptDatabaseInitializer
# runs silently and there's no log evidence that schema.sql / data.sql
# actually executed. Module 05 verification depends on these lines being
# visible. Acceptable noise level for a single small Lambda; for
# production-volume functions, lower to INFO once verified.
logging.level.org.springframework.jdbc.datasource.init=DEBUG
