# Force Spring Boot to select a SERVLET web application context at startup.
#
# In the Lambda runtime environment, Spring Boot's classpath probing for
# `jakarta.servlet.Servlet` + `ConfigurableWebApplicationContext` returns inconsistent
# results (the shaded-JAR class-presence check does not always resolve correctly under
# the Lambda CustomerClassLoader). Setting the web application type explicitly bypasses
# the probe and guarantees `aws-serverless-java-container-springboot3` gets the
# `AnnotationConfigServletWebServerApplicationContext` it casts to at
# `SpringBootLambdaContainerHandler.initialize:200`.
spring.main.web-application-type=servlet
